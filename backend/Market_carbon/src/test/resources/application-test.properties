# ============================================================
# P1.2 integration-test profile — deterministic, no developer .env,
# NO real secrets. Activated with @ActiveProfiles("test") in ITs.
# The datasource URL is injected per-test-class via @DynamicPropertySource
# (Testcontainers MySQL 8 — same major version as production).
# ============================================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- JWT (test-only value; ≥32 chars for HS256) ---
jwt.secret=p1-integration-test-only-jwt-secret-0123456789abcdef

# --- business constants required at boot (normally from local/prod env) ---
trading_fee=0.05
payment_success_url=http://localhost:5173/deposit-success
payment_cancel_url=http://localhost:5173/deposit-cancel

# --- external providers: DUMMY values; every real call is mocked at the adapter boundary ---
stripe.api.key=sk_test_dummy
paypal.client.id=dummy-id
paypal.client.secret=dummy-secret
paypal.mode=sandbox
aws.s3.bucket=test-bucket
aws.s3.region=ap-southeast-1
aws.accessKeyId=dummy
aws.secretAccessKey=dummy
aws.s3.public-base-url=http://localhost

# --- mail: no connection is made at startup; sends are never asserted in ITs ---
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=dummy
spring.mail.password=dummy
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- AI disabled for integration tests (dummy required fields, every real call mocked) ---
ai.gemini.enabled=false
ai.gemini.api-key=dummy-key
ai.gemini.model=dummy-model
ai.gemini.timeout-ms=1000
ai.vertex.enabled=false
ai.vertex.project-id=dummy-project
ai.vertex.location=us-central1
ai.vertex.model=dummy-model
ai.vertex.timeout-ms=1000

# --- OAuth2 chain builds with a dummy registration ---
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# --- OpenAPI config beans (required at boot) ---
springdoc.title=CarbonX Test API
springdoc.version=test
springdoc.description=Integration test profile
server.url=http://localhost:8082
server.description=local-test

# --- rate limit defaults are fine; VNPay props if required ---
