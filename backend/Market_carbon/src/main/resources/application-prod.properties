# ===============================
# DATABASE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# SECURITY
# ===============================
# P0-A (N4): no fallback on purpose — application must fail to start in production
# when JWT_SECRET is not provided.
jwt.secret=${JWT_SECRET}

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8082}

# ===============================
# FRONTEND / CORS
# ===============================
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://carbonx.io.vn}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://carbonx.io.vn}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# MAIL
# ===============================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ===============================
# AWS S3
# ===============================
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.s3.public-base-url=${AWS_PUBLIC_URL}

# ===============================
# PAYMENT
# ===============================
stripe.api.key=${STRIPE_API_KEY}
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
vnpay.tmnCode=${VNPAY_TMNCODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
# paypal.mode intentionally not overridden here: the base profile uses
# paypal.mode=${PAYPAL_MODE} with no fallback, so production must set PAYPAL_MODE
# explicitly (e.g. "live") instead of silently defaulting to sandbox.

# ===============================
# I18N
# ===============================
spring.messages.basename=messages,ValidationMessages
spring.messages.encoding=UTF-8
spring.messages.use-code-as-default-message=true

# Bắt buộc ở production (không có fallback): app không boot được nếu thiếu, thay vì
# âm thầm dùng giá trị dev (URL thanh toán localhost, phí giao dịch mặc định).
trading_fee=${TRADING_FEE}
payment_success_url=${PAYMENT_SUCCESS_URL}
payment_cancel_url=${PAYMENT_CANCEL_URL}
springdoc.title=${SWAGGER_TITLE}
springdoc.version=${SWAGGER_VERSION}
springdoc.description=${SWAGGER_DESCRIPTION}
server.url=${SERVER_URL}
server.description=${SERVER_DESCRIPTION}
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}

# --- Tài khoản seed ------------------------------------------------------------
# Bắt buộc ở production, KHÔNG có mật khẩu mặc định: nếu không, mỗi lần deploy lên DB
# trống sẽ tạo tài khoản admin với mật khẩu "Password@1" (ai đọc mã nguồn cũng đăng nhập
# được). Chính sách chia lợi nhuận cũng phải khai ở prod.
carbonx.seed.admin-email=${CARBONX_SEED_ADMIN_EMAIL}
carbonx.seed.admin-password=${CARBONX_SEED_ADMIN_PASSWORD}
carbonx.seed.company-email=${CARBONX_SEED_COMPANY_EMAIL}
carbonx.seed.company-password=${CARBONX_SEED_COMPANY_PASSWORD}
carbonx.seed.cva-email=${CARBONX_SEED_CVA_EMAIL}
carbonx.seed.cva-password=${CARBONX_SEED_CVA_PASSWORD}
carbonx.seed.wallet-balance=${CARBONX_SEED_WALLET_BALANCE:0}
profit-sharing.default-policy.pricing-mode=${PROFIT_SHARING_DEFAULT_PRICING_MODE:CREDIT}
profit-sharing.default-policy.owner-share-pct=${PROFIT_SHARING_DEFAULT_OWNER_SHARE_PCT:0.5}
profit-sharing.default-policy.min-payout=${PROFIT_SHARING_DEFAULT_MIN_PAYOUT:0}
profit-sharing.default-policy.currency=${PROFIT_SHARING_DEFAULT_CURRENCY:USD}
profit-sharing.stale-processing-minutes=${PROFIT_SHARING_STALE_PROCESSING_MINUTES:15}
