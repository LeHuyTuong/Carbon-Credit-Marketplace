server {
  listen 80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Load mime types để .js/.css trả đúng Content-Type
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Static assets: cache dài hạn
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    
    # Fix Cloudflare HTTP/2 protocol error with Range requests
    add_header Accept-Ranges none always;
  }

  # API: proxy tới backend trong docker network (tên service là "be")
  location /api/ {
    proxy_pass http://be:8082/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA fallback: mọi route FE trả về index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
